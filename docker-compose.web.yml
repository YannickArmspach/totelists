# The web app alone — what the Temps `tote-web` project deploys (root
# directory: repository root, preset docker-compose, composePath pointing at
# this file). The build context must be the repository root twice over: the
# pnpm workspace needs it, and the platform's compose security policy forbids
# a context that escapes the project directory — which is why this file lives
# here rather than in apps/web/.
#
# The VITE_* args come from the Temps environment variables; they are baked
# into the client bundle at build time. OPENWEBUI_/TOTE_SVC_ values are runtime
# env, never build args. Local development uses docker-compose.yml instead.
name: tote_web

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_TRAILBASE_URL: ${VITE_TRAILBASE_URL}
        VITE_SITE_URL: ${VITE_SITE_URL}
    environment:
      OPENWEBUI_URL: ${OPENWEBUI_URL:-https://ai.tote.markets}
      OPENWEBUI_ADMIN_API_KEY: ${OPENWEBUI_ADMIN_API_KEY}
      MODEL_CLASSIFY: ${MODEL_CLASSIFY:-qwen3:4b}
      # Separate stacks on the deploy host, so TrailBase is dialed through its
      # public domain rather than a compose-internal hostname.
      TRAILBASE_INTERNAL_URL: ${TRAILBASE_INTERNAL_URL:-https://api.tote.markets}
      TOTE_SVC_EMAIL: ${TOTE_SVC_EMAIL}
      TOTE_SVC_PASSWORD: ${TOTE_SVC_PASSWORD}
    ports:
      # Host port 3100: the deploy host's loopback is shared by several
      # stacks and the default web port is taken there.
      - '127.0.0.1:3100:3000'
