# TrailBase alone — this is what the Temps `tote-api` project deploys (its
# root directory is services/trailbase, preset docker-compose). Local dev uses
# the host `trail` binary via `pnpm dev`; the full local stack lives in the
# repository root docker-compose.yml.
name: tote_api

services:
  trailbase:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port 4100, not 4000: several compose stacks share the deploy
      # host's loopback, and trainloop's trailbase already owns 4000 there.
      - '127.0.0.1:4100:4000'
    volumes:
      - traildepot:/app/traildepot

volumes:
  traildepot:
