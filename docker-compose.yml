# Builds and runs the whole stack: the TrailBase backend and the web app.
#
# The web bundle bakes VITE_* at BUILD time, and those URLs are what the
# BROWSER dials — so VITE_TRAILBASE_URL must be the host-visible origin
# (http://localhost:4000 here), never the compose-internal hostname.
name: tote

services:
  trailbase:
    build: ./services/trailbase
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      PUBLIC_URL: ${TRAILBASE_PUBLIC_URL:-http://localhost:4000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - traildepot:/app/traildepot
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/healthcheck']
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_TRAILBASE_URL: ${VITE_TRAILBASE_URL:-http://localhost:4000}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
    environment:
      # AI goes through Open WebUI (see docker-compose.ai.yml). Defaults point
      # at production so a laptop doesn't need 2 GB of local models; to run AI
      # locally, start that stack and set OPENWEBUI_URL=http://localhost:5100.
      OPENWEBUI_URL: ${OPENWEBUI_URL:-https://ai.tote.markets}
      OPENWEBUI_ADMIN_API_KEY: ${OPENWEBUI_ADMIN_API_KEY:-}
      MODEL_CLASSIFY: ${MODEL_CLASSIFY:-qwen3:4b}
      # Server-to-TrailBase: same network here, so the internal hostname.
      TRAILBASE_INTERNAL_URL: ${TRAILBASE_INTERNAL_URL:-http://trailbase:4000}
      TOTE_SVC_EMAIL: ${TOTE_SVC_EMAIL:-}
      TOTE_SVC_PASSWORD: ${TOTE_SVC_PASSWORD:-}
      FAKE_AI: ${FAKE_AI:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      trailbase:
        condition: service_healthy

volumes:
  traildepot:
