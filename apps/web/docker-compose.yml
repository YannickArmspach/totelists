# The web app alone — this is what the Temps `tote-web` project deploys (its
# root directory is apps/web, preset docker-compose). The build context is the
# REPOSITORY ROOT: the pnpm lockfile and workspace manifest live there, and an
# install without them is not reproducible.
#
# The VITE_* args come from the Temps environment variables; they are baked
# into the client bundle at build time. WHISPER_/MERIDIAN_ keys are runtime
# env, never build args.
name: tote_web

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_TRAILBASE_URL: ${VITE_TRAILBASE_URL}
        VITE_SITE_URL: ${VITE_SITE_URL}
    environment:
      WHISPER_URL: ${WHISPER_URL:-https://whisper-production.dev.ynk.one}
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      MERIDIAN_URL: ${MERIDIAN_URL:-https://meridian.dev.ynk.one}
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY}
    ports:
      - '127.0.0.1:3000:3000'
